<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel del menú · Restful</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0a0a;--card:#131313;--card2:#1a1a1a;--line:#262626;--gold:#C5A55A;--gold2:#D4B96E;--txt:#E8E0D4;--dim:#8a8279;--red:#B22222;--green:#2e9e5b;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5;padding-bottom:90px;}
h1,h2,h3{font-family:Georgia,serif;font-weight:400;}
.wrap{max-width:860px;margin:0 auto;padding:0 14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;}
.btn:hover{border-color:var(--gold);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8923f);color:#1a0e00;border-color:transparent;}
.btn-gold:hover{box-shadow:0 6px 18px rgba(197,165,90,.35);color:#1a0e00;}
.btn-danger{border-color:rgba(178,34,34,.4);color:#e07777;}
.btn-danger:hover{border-color:var(--red);background:rgba(178,34,34,.12);color:#fff;}
.btn-sm{padding:7px 11px;font-size:.78rem;border-radius:8px;}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:9px;font-size:.9rem;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
label{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.hide{display:none!important;}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#login .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 24px;}
#login h1{text-align:center;font-size:1.5rem;color:var(--gold);letter-spacing:.12em;}
#login .sub{text-align:center;color:var(--dim);font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;margin:4px 0 24px;}
#login .help{font-size:.76rem;color:var(--dim);margin-top:14px;line-height:1.6;}

header{position:sticky;top:0;z-index:50;background:rgba(10,10,10,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 0;}
header .inner{display:flex;align-items:center;gap:10px;}
header .brand{font-family:Georgia,serif;color:var(--gold);letter-spacing:.14em;font-size:1rem;}
header .spacer{flex:1;}

#lock{display:none;background:linear-gradient(135deg,rgba(178,34,34,.14),rgba(178,34,34,.06));border:1px solid rgba(178,34,34,.45);border-radius:14px;padding:18px;margin:16px 0;}
#lock.show{display:block;}
#lock h3{color:#e58b8b;font-size:1.05rem;margin-bottom:6px;}
#lock p{color:var(--dim);font-size:.86rem;}

.secbar{display:flex;gap:7px;overflow-x:auto;padding:14px 0 8px;}
.secbar::-webkit-scrollbar{display:none;}
.secbtn{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--dim);font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.secbtn.on{background:var(--card2);border-color:var(--gold);color:var(--gold2);}

.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;}
.item.edited{border-color:var(--gold);}
.item.off{opacity:.5;}
.item .top{display:flex;align-items:flex-start;gap:9px;}
.item .nm{flex:1;font-weight:600;font-size:.95rem;background:none;border:none;border-bottom:1px solid transparent;padding:4px 0;color:#fff;font-family:Georgia,serif;}
.item .nm:focus{border-bottom-color:var(--gold);}
.item .pr{width:88px;text-align:right;color:var(--gold2);font-weight:700;font-family:Georgia,serif;}
.item .ds{background:none;border:none;border-bottom:1px solid transparent;color:var(--dim);font-size:.82rem;resize:vertical;min-height:32px;padding:4px 0;margin-top:6px;}
.item .ds:focus{border-bottom-color:var(--line);}
.item .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--dim);cursor:pointer;user-select:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-weight:700;}
.chip input{width:auto;margin:0;accent-color:var(--gold);}
.chip.on{border-color:var(--red);color:#e58b8b;background:rgba(178,34,34,.1);}
.mini{width:72px;font-size:.8rem;padding:7px 9px;}
.ord{display:flex;gap:4px;margin-left:auto;}
.ord button{width:30px;height:30px;padding:0;font-size:.9rem;}

#bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:60;}
#bar .cnt{flex:1;font-size:.82rem;color:var(--dim);}
#bar .cnt b{color:var(--gold2);}

.msg{padding:11px 14px;border-radius:10px;font-size:.85rem;margin:12px 0;display:none;}
.msg.show{display:block;}
.msg-err{background:rgba(178,34,34,.14);border:1px solid rgba(178,34,34,.4);color:#e58b8b;}
.msg-ok{background:rgba(46,158,91,.14);border:1px solid rgba(46,158,91,.4);color:#5fd090;}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:.88rem;}
@media(max-width:560px){.item .pr{width:74px;}.wrap{padding:0 11px;}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>RESTFUL</h1>
    <div class="sub">Panel del menú</div>
    <div class="msg msg-err" id="loginErr"></div>
    <label>Contraseña</label>
    <input type="password" id="tok" placeholder="••••••••" autocomplete="current-password">
    <button class="btn btn-gold" id="btnIn" style="width:100%;margin-top:14px;">Entrar</button>
    <p class="help">Escribí la contraseña del mes. Queda guardada en este dispositivo,
    no hace falta escribirla de nuevo.</p>
  </div>
</div>

<div id="app" class="hide">
  <header><div class="wrap inner">
    <span class="brand">RESTFUL</span>
    <span class="spacer"></span>
    <a class="btn btn-sm" href="index.html" target="_blank" rel="noopener">Ver menú</a>
    <button class="btn btn-sm" id="btnOut">Salir</button>
  </div></header>

  <div class="wrap">
    <div id="lock"><h3>🔒 Edición pausada</h3><p id="lockTxt"></p></div>
    <div class="msg" id="msg"></div>
    <div class="secbar" id="secbar"></div>
    <div id="items"><div class="empty">Cargando menú…</div></div>
    <button class="btn btn-gold" id="btnAdd" style="width:100%;margin-top:4px;">+ Agregar plato</button>
  </div>

  <div id="bar">
    <span class="cnt" id="cnt">Sin cambios</span>
    <button class="btn btn-sm" id="btnReset" disabled>Descartar</button>
    <button class="btn btn-gold btn-sm" id="btnSave" disabled>Publicar</button>
  </div>
</div>

<script>
(function(){
'use strict';
var API='https://script.google.com/macros/s/AKfycbxXrmUzzWOQFHEO7ST509Xgu5-6vv3m4qt81cPMnlWMygk7jAKxXEB9anaSeoqk1TGj/exec';
var LS='rf_pass';

var S={tok:null,data:null,sha:null,sec:null,dirty:false};
var $=function(i){return document.getElementById(i);};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(v){return (Math.round(v*100)/100).toFixed(2);}

function msg(t,ok){
  var m=$('msg'); m.textContent=t; m.className='msg show '+(ok?'msg-ok':'msg-err');
  clearTimeout(m._t); m._t=setTimeout(function(){m.className='msg';},5000);
}

// Todo pasa por Apps Script: acá solo viaja la contraseña.
// Content-Type text/plain evita el preflight de CORS.
function api(accion,extra){
  var carga={action:accion,password:S.tok};
  if(extra) for(var k in extra) carga[k]=extra[k];
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                    body:JSON.stringify(carga),redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){
      try{ return JSON.parse(t); }
      catch(e){ throw new Error('Respuesta inesperada del servidor'); }
    });
}

// ---------- LOGIN ----------
$('btnIn').addEventListener('click',entrar);
$('tok').addEventListener('keydown',function(e){ if(e.key==='Enter') entrar(); });

function entrar(){
  var t=$('tok').value.trim();
  if(!t) return errLogin('Escribí la contraseña.');
  S.tok=t; $('btnIn').disabled=true; $('btnIn').textContent='Verificando…';
  cargar().then(function(okey){
    $('btnIn').disabled=false; $('btnIn').textContent='Entrar';
    if(okey){ try{localStorage.setItem(LS,t);}catch(e){} abrirApp(); }
  });
}
function errLogin(t){ var m=$('loginErr'); m.textContent=t; m.className='msg msg-err show'; }

$('btnOut').addEventListener('click',function(){
  if(S.dirty && !confirm('Hay cambios sin publicar. ¿Salir igual?')) return;
  try{localStorage.removeItem(LS);}catch(e){}
  location.reload();
});

function abrirApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); render(); }

// ---------- CARGA ----------
function cargar(){
  return api('getMenu').then(function(r){
    if(!r.ok){ errLogin(r.error||'No se pudo cargar el menú.'); return false; }
    if(!r.secciones || !r.secciones.length){ errLogin('La hoja Menu está vacía.'); return false; }
    S.data={secciones:r.secciones};
    if(!S.sec) S.sec=S.data.secciones[0].id;
    return true;
  }).catch(function(e){ errLogin('Sin conexión: '+e.message); return false; });
}

function secActual(){
  var f=S.data.secciones.filter(function(s){return s.id===S.sec;});
  return f.length?f[0]:S.data.secciones[0];
}

// ---------- RENDER ----------
function render(){ renderSec(); renderItems(); renderBar(); }

function renderSec(){
  $('secbar').innerHTML=S.data.secciones.map(function(s){
    return '<button class="secbtn'+(s.id===S.sec?' on':'')+'" data-s="'+s.id+'">'+
           esc(s.nombre)+' ('+s.items.length+')</button>';
  }).join('');
  Array.prototype.forEach.call($('secbar').children,function(b){
    b.onclick=function(){ S.sec=b.getAttribute('data-s'); render(); };
  });
}

function renderItems(){
  var sec=secActual(), list=sec.items;
  if(!list.length){ $('items').innerHTML='<div class="empty">Sin platos en esta sección.</div>'; return; }
  $('items').innerHTML=list.map(function(it,idx){
    return '<div class="item'+(it._e?' edited':'')+(it.visible===false?' off':'')+'" data-i="'+idx+'">'
      +'<div class="top">'
        +'<input class="nm" data-f="nombre" value="'+esc(it.nombre)+'">'
        +'<input class="pr" data-f="precio" type="number" step="0.01" min="0" value="'+money(it.precio)+'">'
      +'</div>'
      +'<textarea class="ds" data-f="descripcion" placeholder="Descripción (opcional)">'+esc(it.descripcion||'')+'</textarea>'
      +'<div class="row">'
        +'<label class="chip'+(it.agotado?' on':'')+'"><input type="checkbox" data-f="agotado"'+(it.agotado?' checked':'')+'> Agotado</label>'
        +'<label class="chip"><input type="checkbox" data-f="visible"'+(it.visible!==false?' checked':'')+'> Visible</label>'
        +'<input class="mini" data-f="peso" placeholder="250g" value="'+esc(it.peso||'')+'">'
        +'<input class="mini" data-f="precio2" type="number" step="0.01" placeholder="2º $" value="'+(it.precio2!=null?money(it.precio2):'')+'">'
        +'<span class="ord">'
          +'<button class="btn btn-sm" data-mv="-1"'+(idx===0?' disabled':'')+'>↑</button>'
          +'<button class="btn btn-sm" data-mv="1"'+(idx===list.length-1?' disabled':'')+'>↓</button>'
          +'<button class="btn btn-sm btn-danger" data-del="1">✕</button>'
        +'</span>'
      +'</div></div>';
  }).join('');
  enlazar();
}

function enlazar(){
  Array.prototype.forEach.call($('items').querySelectorAll('.item'),function(el){
    var idx=parseInt(el.getAttribute('data-i'),10);
    Array.prototype.forEach.call(el.querySelectorAll('[data-f]'),function(inp){
      inp.addEventListener(inp.type==='checkbox'?'change':'input',function(){
        editar(idx,inp,el);
      });
    });
    var mv=el.querySelectorAll('[data-mv]');
    Array.prototype.forEach.call(mv,function(b){
      b.onclick=function(){ mover(idx,parseInt(b.getAttribute('data-mv'),10)); };
    });
    el.querySelector('[data-del]').onclick=function(){ borrar(idx); };
  });
}

function editar(idx,inp,el){
  var it=secActual().items[idx], f=inp.getAttribute('data-f'), v;
  if(inp.type==='checkbox') v=inp.checked;
  else if(inp.type==='number') v=inp.value===''?null:parseFloat(inp.value);
  else v=inp.value;
  if(f==='precio' && (v===null||isNaN(v)||v<0)) return;
  it[f]=v; it._e=true;
  el.classList.add('edited');
  if(f==='agotado') inp.parentNode.classList.toggle('on',v);
  if(f==='visible') el.classList.toggle('off',!v);
  marcar();
}

function mover(idx,d){
  var arr=secActual().items, j=idx+d;
  if(j<0||j>=arr.length) return;
  var t=arr[idx]; arr[idx]=arr[j]; arr[j]=t;
  arr[idx]._e=true; arr[j]._e=true;
  marcar(); renderItems();
}

function borrar(idx){
  var arr=secActual().items;
  if(!confirm('¿Eliminar "'+arr[idx].nombre+'"?')) return;
  arr.splice(idx,1); marcar(); render();
}

$('btnAdd').addEventListener('click',function(){
  var n=prompt('Nombre del plato:'); if(!n||!n.trim()) return;
  var p=parseFloat(prompt('Precio (ej: 8.50):')||'');
  if(isNaN(p)||p<0) return msg('Precio inválido.');
  var arr=secActual().items;
  arr.push({nombre:n.trim(),descripcion:'',peso:'',precio:p,precio2:null,
            decimales:true,agotado:false,visible:true,
            categoria:arr.length?arr[arr.length-1].categoria:'',_e:true});
  marcar(); render();
  window.scrollTo(0,document.body.scrollHeight);
});

function marcar(){ S.dirty=true; renderBar(); }

function renderBar(){
  var n=0;
  S.data.secciones.forEach(function(s){ s.items.forEach(function(i){ if(i._e) n++; }); });
  $('cnt').innerHTML = S.dirty ? ('<b>'+(n||'Varios')+'</b> cambio'+(n===1?'':'s')+' sin publicar') : 'Sin cambios';
  $('btnSave').disabled=!S.dirty;
  $('btnReset').disabled=!S.dirty;
}

$('btnReset').addEventListener('click',function(){
  if(!confirm('¿Descartar todos los cambios sin publicar?')) return;
  S.dirty=false; cargar().then(render);
});

// ---------- PUBLICAR ----------
$('btnSave').addEventListener('click',function(){
  if(!S.dirty) return;
  var b=$('btnSave'); b.disabled=true; b.textContent='Guardando…';

  var limpio={secciones:S.data.secciones.map(function(s){
    return {id:s.id,nombre:s.nombre,subtitulo:s.subtitulo||'',
            items:s.items.map(function(i){
              var p2=(i.precio2===''||i.precio2==null||isNaN(i.precio2))?null:Number(i.precio2);
              return {nombre:i.nombre,descripcion:i.descripcion||'',peso:i.peso||'',
                      precio:Number(i.precio),precio2:p2,
                      decimales:i.decimales!==false,agotado:!!i.agotado,
                      visible:i.visible!==false,categoria:i.categoria||''};
            })};
  })};

  api('guardarMenu',{menu:JSON.stringify(limpio)}).then(function(r){
    b.disabled=false; b.textContent='Publicar';
    if(!r.ok){
      if(r.vencido) return bloquear(r.error);
      return msg(r.error||'No se pudo guardar.');
    }
    S.dirty=false;
    S.data.secciones.forEach(function(s){ s.items.forEach(function(i){ delete i._e; }); });
    render();
    msg('✅ Guardado ('+r.platos+' platos). Ya se ve en el menú.',true);
  }).catch(function(e){
    b.disabled=false; b.textContent='Publicar';
    msg('Sin conexión: '+e.message);
  });
});

function bloquear(t){
  $('lock').classList.add('show'); $('lockTxt').textContent=t;
  $('btnSave').disabled=true; $('btnAdd').disabled=true;
  window.scrollTo(0,0);
}

window.addEventListener('beforeunload',function(e){
  if(S.dirty){ e.preventDefault(); e.returnValue=''; }
});

// ---------- INICIO ----------
(function(){
  var t=null; try{ t=localStorage.getItem(LS); }catch(e){}
  if(!t) return;
  S.tok=t;
  cargar().then(function(ok){ if(ok) abrirApp(); });
})();
})();
</script>
</body>
</html>
