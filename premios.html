<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Premios — Restful Restobar</title>
<style>
  :root{
    --bg:#000; --card:#0f0f0f; --card-line:#1c1c1c;
    --text:#fff; --soft:#888; --gold:#C5A55A; --green:#3FA767; --green-soft:#2a7a4d;
    --lock:#666;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}

  /* HEADER */
  .head{display:flex;align-items:center;justify-content:center;position:relative;padding:18px 0 8px}
  .back{position:absolute;left:0;top:14px;width:42px;height:42px;border-radius:50%;background:#1a1a1a;border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .head h1{font-family:Georgia,serif;font-size:32px;font-weight:700;margin:0;letter-spacing:.3px}
  .pts-have{text-align:center;color:var(--soft);font-size:15px;margin:4px 0 22px}
  .pts-have b{color:#fff;font-weight:600}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:18px 20px;margin-bottom:14px;position:relative}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card-left{flex:1}
  .card-name{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:21px;font-weight:700;line-height:1.15}
  .lock{width:18px;height:18px;flex:0 0 18px;color:var(--lock)}
  .card-desc{margin:6px 0 0;color:var(--soft);font-size:14px;line-height:1.4}
  .card-cost{text-align:right;flex:0 0 auto}
  .card-cost .num{font-family:Georgia,serif;font-size:30px;font-weight:700;line-height:1}
  .card-cost .lbl{display:block;color:var(--soft);font-size:11px;letter-spacing:2px;margin-top:4px;font-weight:600}

  .progress-wrap{margin-top:16px}
  .progress-text{color:var(--soft);font-size:13px;margin-bottom:8px}
  .progress-text.ready{color:var(--green)}
  .progress-bar{height:8px;background:#222;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green-soft),var(--green));border-radius:99px;transition:width .6s ease}

  /* CTA canjear */
  .redeem-btn{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),#D4B96E);color:#000;font-weight:700;font-size:15px;letter-spacing:.5px;cursor:pointer;display:none}
  .card.ready .redeem-btn{display:block}
  .card.ready{border-color:var(--gold)}
  .card.ready .lock{display:none}

  /* RESET BANNER */
  .reset-banner{background:linear-gradient(135deg,#8B0000,#5a0000);border-radius:14px;padding:14px 16px;margin:0 0 16px;font-size:13px;line-height:1.5;color:#fff}
  .reset-banner b{color:var(--gold)}

  /* MODAL canje */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#111;border:1px solid var(--gold);border-radius:18px;padding:28px 22px;text-align:center;max-width:340px;width:100%}
  .modal h2{font-family:Georgia,serif;margin:0 0 6px;color:var(--gold)}
  .modal .code{font-family:'Courier New',monospace;font-size:36px;font-weight:700;letter-spacing:8px;background:linear-gradient(135deg,var(--gold),#D4B96E);color:#000;padding:18px;border-radius:12px;margin:14px 0}
  .modal p{color:var(--soft);font-size:13px;line-height:1.5;margin:8px 0}
  .modal button{margin-top:14px;padding:12px 22px;border-radius:99px;border:none;background:#fff;color:#000;font-weight:600;cursor:pointer}

  .empty{text-align:center;color:var(--soft);padding:60px 20px}
</style>
</head>
<body>

<div class="head">
  <button class="back" onclick="history.back()">‹</button>
  <h1>Premios</h1>
</div>
<div class="pts-have">Tienes <b id="ptsActual">0</b> pts</div>

<div id="resetBanner" class="reset-banner" style="display:none">
  🎉 ¡Llegaste a <b>2000 pts</b>! Canjea tu <b>consumo de $100</b>. Al canjearlo, tus puntos vuelven a 0 para empezar un nuevo ciclo.
</div>

<div id="rewardsList"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">¡Canjeado!</h2>
    <p id="modalDesc">Muestra este código al mesero</p>
    <div class="code" id="modalCode">ABC123</div>
    <p>Válido por 24 horas</p>
    <button onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXrmUzzWOQFHEO7ST509Xgu5-6vv3m4qt81cPMnlWMygk7jAKxXEB9anaSeoqk1TGj/exec';

// Cliente leído de localStorage (lo guarda el menú al hacer login)
const session = JSON.parse(localStorage.getItem('rfb_session') || 'null');
if (!session || !session.telefono) {
  document.body.innerHTML = '<div class="empty">Inicia sesión desde el menú para ver tus premios.</div>';
  throw new Error('no session');
}

let myPoints = 0;

async function api(action, params={}) {
  const url = new URL(SCRIPT_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  return res.json();
}

function lockSVG(){
  return `<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
}

function renderReward(r){
  const cost = Number(r.costo_pts);
  const ready = myPoints >= cost;
  const remaining = Math.max(0, cost - myPoints);
  const pct = Math.min(100, Math.round((myPoints / cost) * 100));

  return `
    <div class="card ${ready ? 'ready' : ''}" data-id="${r.id}" data-cost="${cost}">
      <div class="card-top">
        <div class="card-left">
          <div class="card-name">${ready ? '' : lockSVG()}<span>${r.nombre}</span></div>
          <p class="card-desc">${r.descripcion}</p>
        </div>
        <div class="card-cost">
          <span class="num">${cost}</span>
          <span class="lbl">PTS</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-text ${ready ? 'ready' : ''}">
          ${ready ? '✓ Listo para canjear' : 'Te faltan ' + remaining + ' pts'}
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="redeem-btn" onclick="redeem('${r.id}','${r.nombre.replace(/'/g,"\\'")}')">Canjear</button>
    </div>
  `;
}

async function load(){
  // Refresca puntos del cliente
  const cli = await api('getClient', { telefono: session.telefono });
  if (cli.ok) {
    myPoints = Number(cli.cliente.puntos_actuales) || 0;
    document.getElementById('ptsActual').textContent = myPoints;
    // Actualizar localStorage
    localStorage.setItem('rfb_session', JSON.stringify({ ...session, ...cli.cliente }));
  }
  document.getElementById('resetBanner').style.display = myPoints >= 2000 ? 'block' : 'none';

  const r = await api('getRewards', { telefono: session.telefono });
  const list = (r.rewards || []).sort((a,b)=>Number(a.costo_pts)-Number(b.costo_pts));
  document.getElementById('rewardsList').innerHTML = list.map(renderReward).join('') ||
    '<div class="empty">No hay premios disponibles ahora.</div>';
}

async function redeem(rewardId, nombre){
  if (!confirm('¿Canjear "' + nombre + '"? Se descontarán los puntos.')) return;
  const idemKey = 'redeem_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'redeemReward',
      telefono: session.telefono,
      recompensa_id: rewardId,
      idempotency_key: idemKey
    })
  });
  const data = await res.json();
  if (!data.ok) { alert(data.error || 'Error'); return; }

  document.getElementById('modalCode').textContent = data.codigo;
  document.getElementById('modalTitle').textContent = data.fue_reset ? '🎁 ¡Premio máximo!' : '✓ Canjeado';
  document.getElementById('modalDesc').textContent = data.fue_reset
    ? '¡Felicidades! Disfruta tu consumo de $100. Tus puntos vuelven a 0 para un nuevo ciclo.'
    : 'Muestra este código al mesero';
  document.getElementById('modalBg').classList.add('show');

  await load();
}

function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }

load();
</script>
</body>
</html>
